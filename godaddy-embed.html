<!--
  Best Deals Ads: GoDaddy Website Builder embed (full height, no cut-off).
  In GoDaddy: Edit Website → open the page → click the HTML section (or Add Section → "HTML")
  → replace everything in the Custom Code box with the code below
  → leave "Forced Height" EMPTY → Done → Publish.

  The frame grows to the full height of the checkout, so the page scrolls normally on phones.
  If the bottom is still cut off after publishing, use godaddy-embed-fixed.html instead.
-->
<iframe id="bda-checkout" src="https://hamstari.github.io/adcheckout/" title="Best Deals Ads" scrolling="no"
        style="width:100%;border:0;display:block;height:900px;overflow:hidden"></iframe>
<script>
  (function () {
    var f = document.getElementById("bda-checkout");
    window.addEventListener("message", function (e) {
      if (!e.data || e.source !== f.contentWindow) return;
      if (e.data.type === "bda-height") {
        f.style.height = e.data.height + "px";                       // grow or shrink to fit: no inner scrolling
        e.source.postMessage({ type: "bda-auto" }, "*");             // tell the checkout the frame fits it
      }
      if (e.data.type === "bda-scrolltop") f.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  })();
</script>
